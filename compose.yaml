services:
  betterer-sync:
    container_name: betterer-sync
    image: ${BETTERER_SYNC_IMAGE:-ghcr.io/itsrenoria/betterer-sync:latest}
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/sync.db
      PORT: 3000
    volumes:
      - betterer-sync-data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"

volumes:
  betterer-sync-data:
